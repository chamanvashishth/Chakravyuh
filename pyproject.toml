[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chakravyuh"
version = "1.0.0"
description = "Active Voice-Clone Honeypot for Scam Calls (vachana-vc-v1 [1, 768] torch.bfloat16 + Prisma v2.5 8kHz ASR + Evon v3.3 Hinglish Deception)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chakravyuh Security Engineering Team" }
]
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn>=0.17.6",
    "pydantic>=1.10.4",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.23.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
